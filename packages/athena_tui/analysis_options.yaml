# athena_tui 分析配置:纯 Dart + nocterm,与 athena_core 相同的 lints 包。
include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true

linter:
  rules:
    # 同 athena_core：语言版本下限提到 3.12 后该规则被启用，存量风格不改。
    prefer_initializing_formals: false
