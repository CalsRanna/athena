# athena_gui 分析配置。
#
# 用 flutter_lints 而非 package:lints：本包是 Flutter 前端，需要 Flutter 特有的
# lint（use_build_context_synchronously 等）。
include:
  - package:flutter_lints/flutter.yaml
  - ../../shared_analysis_options.yaml

analyzer:
  exclude:
    # 平台目录由 Flutter 脚手架生成，不参与本仓库的风格约束。
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - build/**
