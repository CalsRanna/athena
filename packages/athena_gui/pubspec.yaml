name: athena_gui
description: Athena desktop/mobile GUI (Flutter), consuming athena_core.
publish_to: "none"
resolution: workspace

version: 4.0.13+1201

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  athena_core:
    path: ../athena_core

  auto_route: ^11.1.0
  file_picker: ^13.1.0
  # flutter_markdown 已被官方标记 discontinued（替代品 flutter_markdown_plus）。
  # flutter_markdown_latex 0.3.4 仍依赖 flutter_markdown <0.8.0，故暂时保留；
  # 迁移 latex 能力到 flutter_markdown_plus 后再一并换掉。
  flutter_markdown: ^0.7.6+1
  flutter_markdown_latex: ^0.3.4
  flutter_staggered_grid_view: ^0.7.0
  get_it: ^9.3.0
  pasteboard: ^0.5.0
  markdown: ^7.2.2
  path: ^1.8.0
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  # 只被 lib/storage/prefs_into_setting_migration.dart 使用：一次性把旧版本的
  # 偏好搬进 ~/.athena/setting.yaml。设置本身已不走 SharedPreferences。
  shared_preferences: ^2.0.15
  # mcp_dart:
  #   git:
  #     url: git@github.com:CalsRanna/mcp_dart.git
  openai_dart: ^11.0.1
  package_info_plus: ^10.2.2
  path_provider: ^2.0.15
  tray_manager: ^0.8.0
  url_launcher: ^6.3.1
  visibility_detector: ^0.4.0+2
  window_manager: ^0.5.1
  windows_single_instance: ^1.2.0
  lucide_icons_flutter: ^4.0.1

dependency_overrides:
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  auto_route_generator: ^10.6.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - asset/
    - asset/image/

  # Fira Code：只含拉丁字母、数字与符号，汉字交给系统中文（macOS 苹方 /
  # Windows 雅黑）。只打包 Regular 一档，约 290KB。
  #
  # 不需要其他字重：用它的两处都只取 w400——消息里的代码（由 prose 派生）
  # 与运行统计（captionCode）。界面上的 w500/w600 走的是系统字族，命中不了
  # 这个族。将来若给代码加粗体，再补文件。
  #
  # 它本身不含 CJK，无需裁剪；版权声明里没有 Reserved Font Name，
  # 因此可以沿用原族名，不必改名。
  # 无斜体文件：Markdown 的 em 由 Flutter 合成倾斜。
  #
  # 许可证在包根目录的 OFL-FiraCode.txt，不在 asset/ 下：OFL 第 2 条要求
  # 再分发时附带版权声明与许可证，放在包根即可随源码分发，又不额外占包体。
  fonts:
    - family: FiraCode
      fonts:
        - asset: asset/font/FiraCode-Regular.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "asset/image/launcher_icon_ios_512x512.jpg"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "asset/image/launcher_icon_macos_512x512.png"
