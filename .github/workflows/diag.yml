name: Diag

on:
  push:
    branches:
      - 'diag/**'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libsqlite3-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            ninja-build \
            pkg-config \
            cmake

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Pub get
        working-directory: packages/athena_gui
        run: flutter pub get

      - name: Generate code
        working-directory: packages/athena_gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Diagnose
        working-directory: packages/athena_gui
        run: |
          echo "=== compiler versions ==="
          g++ --version | head -1
          clang++ --version 2>/dev/null | head -1 || echo "no clang++"
          echo
          echo "=== flutter build linux -v (raw compile lines) ==="
          flutter build linux -v 2>&1 | grep -E "c\+\+|clang|ccache|my_application" | head -20 || true
          echo
          echo "=== flags.make ==="
          cat build/linux/x64/release/CMakeFiles/athena.dir/flags.make 2>/dev/null || true
          echo
          echo "=== gfileutils.h on system ==="
          find /usr/include -name "gfileutils.h" 2>/dev/null
          echo
          echo "=== manual syntax check with pkg-config gtk+-3.0 ==="
          (
            cd linux
            g++ -fsyntax-only $(pkg-config --cflags gtk+-3.0) -I"$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64/flutter_linux" -Iflutter my_application.cc 2>&1 | head -20
          )
          echo "EXIT: $?"
