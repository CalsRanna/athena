name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 release workflow 及本地开发版本保持一致
          flutter-version: 3.41.4
          cache: true

      - name: Pub get (athena_core)
        working-directory: packages/athena_core
        run: dart pub get

      - name: Analyze (athena_core)
        working-directory: packages/athena_core
        run: dart analyze

      # athena_core/test 现已有用例（command_analyzer_test / file_storage_test），
      # 此步会执行；目录若再次清空（dart test 会以 exit 65
      # "default test/ directory doesn't exist" 失败）则自动跳过
      - name: Test (athena_core)
        if: hashFiles('packages/athena_core/test/**', 'packages/athena_core/test/*') != ''
        working-directory: packages/athena_core
        run: dart test

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 release workflow 及本地开发版本保持一致
          flutter-version: 3.41.4
          cache: true

      - name: Pub get (athena_gui)
        working-directory: packages/athena_gui
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: packages/athena_gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (athena_gui)
        working-directory: packages/athena_gui
        run: flutter analyze

      # 同上：测试目录为空时跳过，有测试后自动恢复
      - name: Test (athena_gui)
        if: hashFiles('packages/athena_gui/test/**', 'packages/athena_gui/test/*') != ''
        working-directory: packages/athena_gui
        run: flutter test
