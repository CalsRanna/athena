name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release workflow 在打包前调用本 workflow：发布出去的版本必须过同一套检查
  workflow_call:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 release workflow 及本地开发版本保持一致
          flutter-version: 3.47.1
          cache: true

      - name: Pub get (athena_core)
        working-directory: packages/athena_core
        run: dart pub get

      - name: Analyze (athena_core)
        working-directory: packages/athena_core
        run: dart analyze

      # 不加「目录为空就跳过」的守卫：测试目录被误删时应当失败，而不是静默变绿
      - name: Test (athena_core)
        working-directory: packages/athena_core
        run: dart test

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 release workflow 及本地开发版本保持一致
          flutter-version: 3.47.1
          cache: true

      - name: Pub get (athena_tui)
        working-directory: packages/athena_tui
        run: dart pub get

      - name: Analyze (athena_tui)
        working-directory: packages/athena_tui
        run: dart analyze

      - name: Test (athena_tui)
        working-directory: packages/athena_tui
        run: dart test

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 release workflow 及本地开发版本保持一致
          flutter-version: 3.47.1
          cache: true

      - name: Pub get (athena_gui)
        working-directory: packages/athena_gui
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: packages/athena_gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (athena_gui)
        working-directory: packages/athena_gui
        run: flutter analyze

      - name: Test (athena_gui)
        working-directory: packages/athena_gui
        run: flutter test
