name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 release workflow 及本地开发版本保持一致
          flutter-version: 3.41.4
          cache: true

      - name: Pub get (athena_core)
        working-directory: packages/athena_core
        run: dart pub get

      - name: Analyze (athena_core)
        working-directory: packages/athena_core
        run: dart analyze

      - name: Test (athena_core)
        working-directory: packages/athena_core
        run: dart test

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 release workflow 及本地开发版本保持一致
          flutter-version: 3.41.4
          cache: true

      - name: Pub get (athena_gui)
        working-directory: packages/athena_gui
        run: flutter pub get

      - name: Generate code (build_runner)
        working-directory: packages/athena_gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (athena_gui)
        working-directory: packages/athena_gui
        run: flutter analyze

      - name: Test (athena_gui)
        working-directory: packages/athena_gui
        run: flutter test
