name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 先建空 Release，各平台 job 并行 upload asset（已存在则跳过，保证重跑幂等）
      # --draft=false 显式发布，避免 gh release create 留下草稿
      - run: gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.41.4
          cache: true

      - name: Pub get
        working-directory: packages/athena_gui
        run: flutter pub get

      - name: Generate code
        working-directory: packages/athena_gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS app
        working-directory: packages/athena_gui
        run: flutter build macos

      - name: Package macOS app
        working-directory: packages/athena_gui/build/macos/Build/Products/Release
        run: |
          APP_BUNDLE="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "No .app bundle found in $(pwd)"
            ls -la
            exit 1
          fi
          zip -r -y Athena-macOS.zip "$APP_BUNDLE"

      # 直传 Release（create-release 已预建，--clobber 容忍重跑）
      - name: Upload asset
        working-directory: packages/athena_gui/build/macos/Build/Products/Release
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "Athena-macOS.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.41.4
          cache: true

      - name: Pub get
        working-directory: packages/athena_gui
        run: flutter pub get

      - name: Generate code
        working-directory: packages/athena_gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows app
        working-directory: packages/athena_gui
        run: flutter build windows

      - name: Package Windows app
        working-directory: packages/athena_gui
        shell: pwsh
        run: |
          # 保留 Flutter 原生 exe 名（athena.exe，与包名一致）；
          # zip 内 exe 名与 asset 基名不同，由 .tapster.yaml 的 bin 字段显式声明
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Athena-Windows.zip

      # 直传 Release（create-release 已预建，--clobber 容忍重跑）
      - name: Upload asset
        working-directory: packages/athena_gui
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "Athena-Windows.zip" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libsqlite3-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            ninja-build \
            pkg-config \
            cmake

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与 ci workflow 及代码库目标版本保持一致
          flutter-version: 3.41.4
          cache: true

      - name: Pub get
        working-directory: packages/athena_gui
        run: flutter pub get

      - name: Generate code
        working-directory: packages/athena_gui
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux app
        working-directory: packages/athena_gui
        run: flutter build linux

      - name: Package Linux app
        working-directory: packages/athena_gui
        run: tar -czf Athena-Linux.tar.gz -C build/linux/x64/release/bundle .

      # 直传 Release（create-release 已预建，--clobber 容忍重跑）
      - name: Upload asset
        working-directory: packages/athena_gui
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "Athena-Linux.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
